<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur de Données JSON</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container-fluid { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .file-upload-section { border: 2px dashed #dee2e6; padding: 20px; text-align: center; margin-bottom: 30px; border-radius: 8px; }
        .file-upload-section:hover { border-color: #0d6efd; background-color: #f0f7ff; }
        #dataTable { font-size: 0.85rem; }
        .dt-buttons { margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <header class="mb-4">
        <h1 class="text-primary">Analyseur de Données</h1>
        <p class="text-muted">Chargez votre fichier JSON pour l'analyser, le filtrer et l'exporter.</p>
    </header>
    
    <div class="file-upload-section">
        <label for="jsonFileInput" class="form-label fw-bold">Importer un fichier JSON</label>
        <input class="form-control" type="file" id="jsonFileInput" accept=".json">
    </div>
    
    <div id="tableWrapper" style="display: none;">
        <div class="table-responsive">
            <table id="dataTable" class="table table-hover table-bordered w-100">
                <thead>
                    <tr id="tableHeadRow"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

<script>
    $(document).ready(function() {
        let table;

        $('#jsonFileInput').on('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const jsonData = JSON.parse(event.target.result);
                    processAndDisplayData(jsonData);
                } catch (error) {
                    alert("Erreur de format JSON : " + error.message);
                }
            };
            reader.readAsText(file);
        });

        function processAndDisplayData(data) {
            if (!Array.isArray(data) || data.length === 0) {
                alert("Le JSON doit être un tableau d'objets ou de tableaux.");
                return;
            }

            // Show table wrapper
            $('#tableWrapper').show();

            // Clear previous table instance
            if (table) {
                table.destroy();
                $('#tableHeadRow').empty();
                $('#tableBody').empty();
            }

            // Transformation des données pour ne garder que les colonnes voulues
            const transformedData = data.map(row => {
                if (Array.isArray(row)) {
                    let proprietaireRaw = (row[12] || "").toString().trim();
                    let typeClient = "Autre";
                    let codeClient = "";
                    let client = proprietaireRaw;
                    let produit = "";
                    let acquisition = "";

                    if (proprietaireRaw.startsWith("TR") && proprietaireRaw.includes("#")) {
                        typeClient = "DGH";
                        produit = "PROTRACK";
                    }

                    if (proprietaireRaw.includes("#")) {
                        const parts = proprietaireRaw.split("#");
                        codeClient = parts[0].trim();
                        client = parts.slice(1).join("#").trim();

                        if (client.includes("DISPOSITION")) {
                            produit = "PROVISION";
                            client = codeClient;
                        } else if (client.includes("PRIVE")) {
                            acquisition = "ACHAT DE BALISE";
                            client = codeClient;
                        }
                    }

                    let simRaw = (row[14] || "").toString().trim();
                    let commentaireSim = simRaw;
                    let typeSim = "LOCAL";
                    let simFinal = simRaw;

                    let upperSim = simRaw.toUpperCase();
                    if (upperSim.includes("ROAMING") || (simRaw.includes("+") && !simRaw.includes("+225"))) {
                        typeSim = "Roaming";
                    }

                    let justDigits = simRaw.replace(/\D/g, '');
                    if (justDigits.length === 10) {
                        simFinal = "+225" + justDigits;
                    } else if (justDigits.startsWith("225") && justDigits.length === 13) {
                        simFinal = "+" + justDigits;
                    } else if (justDigits.length > 0) {
                        if (simRaw.includes("+") && !simRaw.includes("+225")) {
                            simFinal = "+" + justDigits;
                        } else {
                            if (!justDigits.startsWith("225")) {
                                simFinal = "+225" + justDigits;
                            } else {
                                simFinal = "+" + justDigits;
                            }
                        }
                    } else {
                        simFinal = "";
                    }

                    // Traitement de la date d'installation
                    let dateInstallationRaw = (row[11] || "").toString().trim();
                    let dateInstallation = "";
                    let commentaireInstallation = "";

                    // Regex pour capter "DD-MM-YYYY" ou "DD/MM/YYYY" exactement
                    let datePattern1 = /^(\d{2})[-/](\d{2})[-/](\d{4})$/;
                    // Regex pour capter "INSTALLE LE DD-MM-YYYY"
                    let datePattern2 = /^INSTALLE\s+LE\s+(\d{2})[-/](\d{2})[-/](\d{4})$/i;

                    let match1 = dateInstallationRaw.match(datePattern1);
                    let match2 = dateInstallationRaw.match(datePattern2);

                    if (match1) {
                        dateInstallation = match1[1] + "/" + match1[2] + "/" + match1[3];
                    } else if (match2) {
                        dateInstallation = match2[1] + "/" + match2[2] + "/" + match2[3];
                    } else if (dateInstallationRaw.length > 0) {
                        // Cas complexe
                        commentaireInstallation = dateInstallationRaw;

                        // Extraction de la date si présente dans le commentaire complexe
                        let extractMatch = commentaireInstallation.match(/(\d{2})[-/](\d{2})[-/](\d{2,4})/);
                        if (extractMatch) {
                            let jj = extractMatch[1];
                            let mm = extractMatch[2];
                            let aaaa = extractMatch[3];
                            // Si l'année est sur 2 chiffres, on ajoute "20" devant
                            if (aaaa.length === 2) {
                                aaaa = "20" + aaaa;
                            }
                            dateInstallation = jj + "/" + mm + "/" + aaaa;
                        }
                    }

                    // Traitement Matricule et Historique
                    let matriculeRaw = (row[2] || "").toString().trim();
                    let matricule = matriculeRaw;
                    let identification = matriculeRaw;
                    let dateDesactivation = "";
                    let dateDesinstallation = "";

                    if (identification.includes("__")) {
                        let parts = identification.split("__");
                        matricule = parts[0];

                        // Helper for YYYY-MM-DD -> DD/MM/YYYY
                        const formatToFrenchDate = (dStr) => {
                            let clean = dStr.replace(/-/g, '/');
                            let m = clean.match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
                            if (m) return m[3] + "/" + m[2] + "/" + m[1];
                            return clean;
                        };

                        let desactiveMatch = identification.match(/DESACTIVE LE\s+(\d{2,4}[-/]\d{2}[-/]\d{2,4})/i);
                        if (desactiveMatch) {
                            dateDesactivation = formatToFrenchDate(desactiveMatch[1]);
                        }

                        let desinstalleMatch = identification.match(/DESINSTALLE LE\s+(\d{2,4}[-/]\d{2}[-/]\d{2,4})/i);
                        if (desinstalleMatch) {
                            dateDesinstallation = formatToFrenchDate(desinstalleMatch[1]);
                        }
                    }

                    // Traitement final de la colonne Matricule (symboles de fin et symboles au milieu)
                    matricule = matricule.trim();
                    
                    if (matricule.includes("*")) {
                        acquisition = "LOCATION DE BALISE";
                        matricule = matricule.split("*")[0].trim();
                    } else if (matricule.endsWith(".")) {
                        acquisition = "ACHAT DE BALISE";
                        matricule = matricule.slice(0, -1).trim();
                    } else if (matricule.endsWith("=")) {
                        acquisition = "PROPRIETAIRE DE BALISE";
                        produit = "WITRACK";
                        matricule = matricule.slice(0, -1).trim();
                    }

                    // Règle spécifique pour DGH
                    if (typeClient === "DGH") {
                        acquisition = "ACHAT DE BALISE";
                    }

                    // Vérification de la spécificité pour ajouter le + au produit
                    let specificiteRaw = (row[13] || "").toString().trim();
                    if (specificiteRaw.toUpperCase().includes("SONDE")) {
                        if (produit === "PROVISION") {
                            produit = "PROVISION+";
                        } else if (produit === "PROTRACK") {
                            produit = "PROTRACK+";
                        }
                    }

                    let transformedObj = {
                        idDevice: (row[0] || "").toString(),
                        matricule: matricule,
                        identification: identification,
                        emei: (row[3] || "").toString(),
                        status: (row[4] || "").toString(),
                        vitesse: (row[6] || "").toString(),
                        protocole: (row[7] || "").toString(),
                        balise: (row[8] || "").toString(),
                        dateInstallation: dateInstallation,
                        commentaireInstallation: commentaireInstallation,
                        dateDesactivation: dateDesactivation,
                        dateDesinstallation: dateDesinstallation,
                        typeClient: typeClient,
                        codeClient: codeClient,
                        client: client,
                        produit: produit,
                        acquisition: acquisition,
                        specificite: specificiteRaw,
                        sim: simFinal,
                        typeSim: typeSim,
                        commentaireSim: commentaireSim
                    };

                    // Conversion de toutes les valeurs en majuscules
                    Object.keys(transformedObj).forEach(key => {
                        if (typeof transformedObj[key] === 'string') {
                            transformedObj[key] = transformedObj[key].toUpperCase();
                        }
                    });

                    return transformedObj;
                }
                return row; // Si c'est déjà un objet (fallback)
            });

            const columnDefs = [
                { title: "Id Device", data: "idDevice" },
                { title: "Matricule", data: "matricule" },
                { title: "Identification", data: "identification" },
                { title: "Emei", data: "emei" },
                { title: "Status", data: "status" },
                { title: "Vitesse", data: "vitesse" },
                { title: "Protocole", data: "protocole" },
                { title: "Balise", data: "balise" },
                { title: "Date d'installation", data: "dateInstallation" },
                { title: "Commentaire Installation", data: "commentaireInstallation" },
                { title: "Date de désactivation", data: "dateDesactivation" },
                { title: "Date de désinstallation", data: "dateDesinstallation" },
                { title: "Type Client", data: "typeClient" },
                { title: "Code Client", data: "codeClient" },
                { title: "Client", data: "client" },
                { title: "Produit", data: "produit" },
                { title: "Acquisition", data: "acquisition" },
                { title: "Spécificité", data: "specificite" },
                { title: "SIM", data: "sim" },
                { title: "Type SIM", data: "typeSim" },
                { title: "Commentaire SIM", data: "commentaireSim" }
            ];

            columnDefs.forEach(col => {
                $('#tableHeadRow').append(`<th>${col.title}</th>`);
            });

            // Initialize DataTable
            table = $('#dataTable').DataTable({
                data: transformedData,
                columns: columnDefs,
                dom: 'Bfrtip',
                buttons: [
                    { extend: 'excel', text: 'Exporter Excel', className: 'btn btn-success' },
                    { extend: 'csv', text: 'Exporter CSV', className: 'btn btn-info' },
                    { extend: 'pdf', text: 'Exporter PDF', className: 'btn btn-danger' },
                    { extend: 'copy', text: 'Copier', className: 'btn btn-secondary' }
                ],
                pageLength: 25,
                order: [], // No initial sort
                scrollX: true,
                language: {
                    "sProcessing":     "Traitement en cours...",
                    "sSearch":         "Rechercher&nbsp;:",
                    "sLengthMenu":     "Afficher _MENU_ &eacute;léments",
                    "sInfo":           "Affichage de l'&eacute;lément _START_ &agrave; _END_ sur _TOTAL_ &eacute;léments",
                    "sInfoEmpty":      "Affichage de l'&eacute;lément 0 &agrave; 0 sur 0 &eacute;lément",
                    "sInfoFiltered":   "(filtr&eacute; de _MAX_ &eacute;léments au total)",
                    "sInfoPostFix":    "",
                    "sLoadingRecords": "Chargement en cours...",
                    "sZeroRecords":    "Aucun &eacute;lément &agrave; afficher",
                    "sEmptyTable":     "Aucune donn&eacute;e disponible dans le tableau",
                    "oPaginate": {
                        "sFirst":      "Premier",
                        "sPrevious":   "Pr&eacute;c&eacute;dent",
                        "sNext":       "Suivant",
                        "sLast":       "Dernier"
                    },
                    "oAria": {
                        "sSortAscending":  ": activer pour trier la colonne par ordre croissant",
                        "sSortDescending": ": activer pour trier la colonne par ordre d&eacute;croissant"
                    }
                }
            });
        }
    });
</script>

</body>
</html>
